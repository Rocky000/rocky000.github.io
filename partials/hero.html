<section class="hero" id="home">
  <canvas class="hero__canvas" id="heroCanvas" aria-hidden="true"></canvas>
  <div class="hero__veil" aria-hidden="true"></div>
  <div class="hero__inner">
    <div class="hero__copy">
      <p class="hero__eyebrow">
        <span class="pulse" aria-hidden="true"></span>
        <span id="heroLocation"></span>
      </p>
      <h1 class="hero__name" id="heroName"></h1>
      <p class="hero__title" id="heroTitle"></p>
      <p class="hero__tagline" id="heroTagline"></p>
      <div class="hero__actions">
        <a class="btn btn--primary" href="#projects">
          View my work <svg class="icon" aria-hidden="true"><use href="#i-arrow"></use></svg>
        </a>
        <a class="btn btn--ghost" id="heroResume" href="#" download>
          <svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg> Resume
        </a>
      </div>
      <ul class="hero__stats" id="heroStats"></ul>
    </div>
    <div class="hero__portrait">
      <div class="portrait" id="heroPortrait">
        <div class="portrait__glow" aria-hidden="true"></div>
        <img id="heroPhoto" src="" alt="Portrait of Md. Rockibul Islam Khan" width="1050" height="1400">
      </div>
    </div>
  </div>
  <a class="hero__scroll" href="#about" aria-label="Scroll to about">
    <span class="hero__mouse" aria-hidden="true"></span>
  </a>
</section>
