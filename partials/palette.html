<div class="cmd" id="cmdPalette" hidden>
  <div class="cmd__backdrop" data-cmd-close></div>
  <div class="cmd__dialog" role="dialog" aria-modal="true" aria-labelledby="cmdTitle">
    <p class="cmd__kicker" id="cmdTitle">Command palette</p>
    <input class="cmd__input" id="cmdInput" type="search" placeholder="Jump, copy, open…" autocomplete="off" spellcheck="false" aria-label="Search commands" aria-controls="cmdList">
    <ul class="cmd__list" id="cmdList" aria-label="Commands"></ul>
    <p class="cmd__hint">↑↓ navigate · ↵ run · esc close</p>
  </div>
</div>
