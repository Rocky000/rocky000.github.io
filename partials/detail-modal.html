<div class="popup" id="detailModal" hidden>
  <div class="popup__backdrop" data-popup-close></div>
  <div class="popup__dialog" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <header class="popup__head">
      <div class="popup__heading">
        <h2 class="popup__title" id="popupTitle"></h2>
        <p class="popup__subtitle" id="popupSubtitle" hidden></p>
      </div>
      <button type="button" class="popup__close" data-popup-close aria-label="Close">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg>
      </button>
    </header>
    <div class="popup__body" id="popupBody"></div>
  </div>
</div>
