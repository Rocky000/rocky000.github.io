<section class="hero" id="home">
  <div class="hero-stage" aria-hidden="true"></div>
  <figure class="hero-portrait">
    <img id="heroPortrait" src="" alt="" decoding="async" fetchpriority="high">
  </figure>
  <div class="grain" aria-hidden="true"></div>
  <div class="hero__inner">
    <div class="hero__copy">
      <p class="hero__eyebrow">
        <span class="pulse" aria-hidden="true"></span>
        <span id="heroLocation"></span>
      </p>
      <h1 class="hero__name" id="heroName"></h1>
      <p class="hero__role">
        <span class="hero__role-label">I am a</span>
        <span class="hero__type" id="heroType" aria-live="polite"></span>
        <span class="hero__caret" aria-hidden="true"></span>
      </p>
      <p class="hero__tagline" id="heroTagline"></p>
      <div class="hero__actions">
        <a class="btn btn--primary" href="#projects">
          See the work <svg class="icon" aria-hidden="true"><use href="#i-arrow"></use></svg>
        </a>
        <a class="btn btn--ghost" href="#contact">Let’s talk</a>
      </div>
    </div>
    <ul class="hero__stats" id="heroStats"></ul>
  </div>
  <a class="hero__scroll" href="#about" aria-label="Scroll to about">
    <span class="hero__mouse" aria-hidden="true"></span>
    <span>Scroll</span>
  </a>
</section>
